services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--locale=en_US.UTF-8"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - CUDA_VISIBLE_DEVICES=""   # Fuerza el modo CPU puro evitando cualquier intento de carga CUDA
      - OLLAMA_NUM_THREADS=4      # Acota el número de hilos de CPU (ajusta según los cores del servidor)
    deploy:
      resources:
        limits:
          memory: 6G              # Límite duro de RAM para evitar fugas de memoria o caídas por OOM
        reservations:
          memory: 4G              # Reserva mínima garantizada
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - internal

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama_init
    depends_on:
      - ollama
    volumes:
      - ./init-ollama.sh:/init-ollama.sh
    command: ["sh", "/init-ollama.sh"]
    networks:
      - internal

  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 300"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    env_file:
      - .env
    depends_on:
      - ollama-init
      - db
    networks:
      - internal

  session-purger:
    build: .
    command: >
      sh -c "while true; do python manage.py purgar_sesiones_inactivas; sleep 86400; done"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    networks:
      - internal
    restart: unless-stopped

volumes:
  pg_data:
  ollama_models:
  static_volume:

networks:
  internal:
    driver: bridge