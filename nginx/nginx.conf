upstream django_web {
    server web:8000;
}

server {
    listen 80; 
    server_name localhost; 

    client_max_body_size 2M; 

    # Endpoint de salud para monitorización y balanceadores
    location /health {
        access_log off; 
        return 200 "healthy\n"; 
        add_header Content-Type text/plain; 
    }

    # Despacho de estáticos y widget JS
    location /static/ {
        alias /app/staticfiles/; 
        
        # Cabeceras CORS: Permite que cualquier dominio cargue el script estático
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        
        # Caché agresiva: El navegador del usuario guardará el JS durante 7 días
        expires 7d;
        add_header Cache-Control "public, no-transform, max-age=604800";
    }

    # Enrutamiento de la API hacia Django
    location / {
        proxy_pass http://django_web; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header X-Forwarded-Proto $scheme; 

        # Timeouts ampliados para soportar inferencia en CPU (Alineado con Gunicorn)
        proxy_connect_timeout 300s; 
        proxy_send_timeout 300s; 
        proxy_read_timeout 300s;
    }
}